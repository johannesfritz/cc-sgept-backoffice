id: invoice-numbering-drive
title: 'Invoice numbering from Drive: next number, refusals, API sync, register, ledger, weekly check'
workspace: root
default_model: sonnet
autonomous: true
allow_push: true
worktree: false
sandbox: false
max_concurrent_stages: 1
description: 'Epic JCC-6899. Executable companion to jf-ceo/sgept-backoffice/invoicing/261001-drive-reconciliation.md
  (Proposed fix), ruled at G1 on 2026-10-01: 10 requirements, R6 cut, R4/R8/R9 restored (plans/invoice-numbering-drive-requirements.md).
  Acceptance tests in tests/ were written at planning time and fail on the pre-work tree for the right
  reasons. worktree: false because generate-invoice.py and gdrive_upload.py resolve jf-private and the
  Drive service-account key relative to the repo''s location, which a nested .run-plan-worktrees checkout
  breaks. sandbox: false because weekly-check-on-metis deploys to the Metis server over ssh (deploy@204.168.141.21).
  Headless stages have no Linear MCP: each brief is self-contained and writes its passes to plans/invoice-numbering-drive-passes/<stage-id>.json.
  Launch from claude-setup/cc-sgept-backoffice: /run-plan plans/invoice-numbering-drive.yaml'
stages:
- id: next-number-from-drive
  title: '[Invoicing]: Take the next invoice number from Drive and local folders'
  status: pending
  dispatch:
    type: claude
  depends_on: []
  inputs:
    brief: |
      STAGE next-number-from-drive: Make the next invoice number the highest number on Drive or locally, plus one, and report one-sided numbers.

      You work in the git repo claude-setup/cc-sgept-backoffice (its own repo, remote
      johannesfritz/cc-sgept-backoffice, branch main). Run every command from that repo root.
      Background: on 2026-10-01 the CEO found two 2026 invoice numbers issued twice (26015 to the
      Australian Permanent Mission and to Rocky Mountain Institute; 26012 to ANU and printed on the
      Hinrich invoice), eight sent invoices missing from the Drive invoicing folder and three Drive
      invoices missing locally. Root causes and the approved fix are in
      ../../jf-ceo/sgept-backoffice/invoicing/261001-drive-reconciliation.md; the ruled requirements are
      in plans/invoice-numbering-drive-requirements.md. Read both before starting.

      Places:
      - Local invoicing folder: the generator's module global OUTPUT_DIR
        (jf-private/jf-ceo/sgept-backoffice/invoicing). Folder names end in " NNNNN", e.g.
        "260911 GTA Interos Inc. 26033".
      - Drive invoicing folder: id 19bPRghIb2L3cdxZzIattO65uM5En6dHM ("5 invoicing (Debitoren)"),
        reached through the Drive API with the service account that scripts/gdrive_upload.py already
        uses (impersonating johannes.fritz@sgept.org). Folder names also end in " NNNNN".
      - Invoice numbers are five digits: two-digit year plus a three-digit sequence (26036).

      Contract the acceptance tests rely on (tests/conftest.py, tests/test_invoice_numbering.py,
      tests/test_drive_sync.py were written at planning time; they are the specification):
      - scripts/generate-invoice.py reaches Drive only through the module gdrive_upload, imported at
        call time (not bound at module import), so a test can replace sys.modules["gdrive_upload"].
      - It reads the local folder through the module global OUTPUT_DIR at call time.
      - gdrive_upload.list_invoice_folders() -> list[str] returns the names of all non-trashed folders
        directly under the Drive invoicing folder (all pages).

      Rules for this stage:
      - Do not edit or weaken tests/conftest.py, tests/test_invoice_numbering.py or
        tests/test_drive_sync.py. You may add new test files under tests/.
      - Follow the code-quality contract (the cc-sgept-os rule code-quality.md and
        to-backlog/references/code-quality.md): typed, documented public functions, no dead code,
        explicit errors. End with the structured self-report.
      - Add one entry to CHANGE-LOG.md at the repo root (create it if absent) in the same commit as the
        change, then commit and push to origin main.
      - Stamp every commit with the trailer "Agent: run-plan/invoice-numbering-drive/<stage-id>".
      - Write caps for this run: at most 3 commits; no Linear writes; no emails sent.
      - Deny boundary: never write to, rename in or delete from the real Drive invoicing folder or the
        local invoicing folder (tests use fakes and temporary folders; real runs only read); never
        renumber or edit an existing invoice; never touch 2025 numbers.
      - Passes: write the passes below to plans/invoice-numbering-drive-passes/<stage-id>.json in the canonical shape
        (id, category, description, steps, passes). Exercise each one, flip it to true and save the
        file immediately after each flip, not in one batch. All passes true is required before DONE.

      WHAT TO BUILD
      1. gdrive_upload.list_invoice_folders() as specified in the contract above.
      2. In generate-invoice.py:
         - next_invoice_number(year: int | None = None) -> str: two-digit year (default: current
           year); returns the highest NNNNN for that year across local and Drive folder names, plus
           one; "YY001" when the year has none.
         - invoice_number_report(year: int | None = None) -> dict with keys "drive_only" and
           "local_only" (sorted lists of number strings present on one side only) and "duplicates"
           (dict: number -> list of folder names, for numbers used by more than one folder on the
           same side).
         - CLI flag --next-number [--year YY]: print the next number as the only stdout line; print
           the report's findings to stderr; exit 0.
      3. Adoption: rules/invoice-governance.md (Numbering), commands/invoice.md,
         commands/invoice-nipo.md and prompts/invoice-handler.md (STEP B, the Metis path) take the
         number from --next-number instead of listing the local folder. Delete the old rule sentence
         "The next number is the maximum of trailing numbers in ... folder names, plus 1."
      Today the real result must be 26036 or higher, and the stderr report must show 26015 as a
      duplicate (two local folders, two Drive folders).

      PASSES (write to plans/invoice-numbering-drive-passes/next-number-from-drive.json, flip eagerly):
      [
        {
          "id": 1,
          "category": "functional",
          "description": "--next-number prints the next free number from Drive and local",
          "steps": [
            "Run python3 scripts/generate-invoice.py --next-number",
            "Confirm stdout is a single five-digit number",
            "Confirm it equals one more than the highest 26xxx across the Drive folder list and the local invoicing folder"
          ],
          "passes": false
        },
        {
          "id": 2,
          "category": "functional",
          "description": "one-sided and duplicate numbers are reported on stderr",
          "steps": [
            "Run the same command and read stderr",
            "Confirm 26015 is reported as used by two folders",
            "Run the report acceptance test and confirm it passes"
          ],
          "passes": false
        },
        {
          "id": 3,
          "category": "integration",
          "description": "the commands, the governance rule and the Metis handler use --next-number",
          "steps": [
            "Read the numbering step of commands/invoice.md, commands/invoice-nipo.md, rules/invoice-governance.md and prompts/invoice-handler.md",
            "Confirm each calls --next-number and none lists the local folder to pick a number"
          ],
          "passes": false
        }
      ]
      DONE WHEN: --next-number returns the highest number on Drive or locally plus one, and every numbering instruction uses it.

      === SCOPE FENCE: WHAT THIS SLICE DOES NOT OWN ===
      Earlier stages: none.
      Later stages own: refusing used numbers (refuse-used-numbers), the macOS API sync (mac-sync-via-drive-api), --register (register-outside-invoice), --ledger (invoice-register-export), the Metis cron and server deployment (weekly-check-on-metis).
      This slice owns: list_invoice_folders, next_invoice_number, invoice_number_report, --next-number, and the four adoption edits.
      Out of scope per the plan: R6 printed-number check; renumbering or reissuing sent invoices; 2025 numbers; committing Metis drafts to jf-private; templates, amounts, bank details, the 9-point read-back.
      Settled decisions (do not reopen): Drive and local are both authoritative inputs; the printed-number check (R6) is cut; existing invoices keep their numbers; the plan runs without a worktree and without the sandbox (the Metis stage needs ssh).
  acceptance:
  - description: acceptance test test_next_number_takes_max_of_drive_and_local passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_next_number_takes_max_of_drive_and_local
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no next_invoice_number() (2026-10-01)'
  - description: acceptance test test_next_number_starts_new_year_at_001 passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_next_number_starts_new_year_at_001
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no next_invoice_number() (2026-10-01)'
  - description: acceptance test test_report_lists_one_sided_and_duplicate_numbers passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_report_lists_one_sided_and_duplicate_numbers
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no invoice_number_report() (2026-10-01)'
  - description: the real next number, from Drive and local, is at least 26036
    verify: n=$(python3 scripts/generate-invoice.py --next-number 2>/dev/null) && [ "$n" -ge 26036 ]
    baseline_expect: fail
    baseline_observed: 'exit 2: argparse rejects --next-number (2026-10-01)'
  - description: the real report names 26015 as a duplicate
    verify: python3 scripts/generate-invoice.py --next-number 2>&1 >/dev/null | grep -q 26015
    baseline_expect: fail
    baseline_observed: 'exit 1: argparse error text, no 26015 (2026-10-01)'
  - description: commands, rule and Metis handler take the number from --next-number
    verify: grep -q -- --next-number rules/invoice-governance.md && grep -q -- --next-number commands/invoice.md
      && grep -q -- --next-number commands/invoice-nipo.md && grep -q -- --next-number prompts/invoice-handler.md
    baseline_expect: fail
    baseline_observed: 'exit 1: flag absent from all four files (2026-10-01)'
  - description: the local-folder-only numbering rule is gone
    verify: '! grep -q ''maximum of trailing numbers'' rules/invoice-governance.md'
    baseline_expect: fail
    baseline_observed: 'exit 1: sentence present in the Numbering section (2026-10-01)'
  - description: acceptance test test_regenerating_same_invoice_is_allowed passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_regenerating_same_invoice_is_allowed
    baseline_expect: pass
    baseline_observed: 'exit 0: 1 passed (2026-10-01)'
  referee: true
  outputs:
    linear: JCC-6900
