      - Passes: write the passes below to plans/invoice-numbering-drive-passes/<stage-id>.json in the canonical shape
        (id, category, description, steps, passes). Exercise each one, flip it to true and save the
        file immediately after each flip, not in one batch. All passes true is required before DONE.

      WHAT TO BUILD
      In generate-invoice.py, before anything is written, both generators (NIPO and standard, and
      therefore generate_from_spec) raise ValueError naming the number and the conflicting folder when:
      - a local folder other than this invoice's target folder ends with the number, or
      - a Drive folder ends with the number while no local folder does (an invoice made elsewhere).
      Regenerating into the same target folder stays allowed even when Drive has the number.
      Expose the decision as number_in_use(number: str, target_folder: str | None = None) -> str | None
      (None when free, otherwise a one-line reason). Reuse the folder listing built by
      next-number-from-drive. Nothing may be written when the number is refused.

