id: invoice-numbering-drive
title: 'Invoice numbering from Drive: next number, refusals, API sync, register, ledger,
  weekly check'
workspace: root
default_model: sonnet
autonomous: true
allow_push: true
worktree: false
sandbox: false
max_concurrent_stages: 1
description: 'Epic JCC-6899. Executable companion to jf-ceo/sgept-backoffice/invoicing/261001-drive-reconciliation.md
  (Proposed fix), ruled at G1 on 2026-10-01: 10 requirements, R6 cut, R4/R8/R9 restored
  (plans/invoice-numbering-drive-requirements.md). Acceptance tests in tests/ were
  written at planning time and fail on the pre-work tree for the right reasons. worktree:
  false because generate-invoice.py and gdrive_upload.py resolve jf-private and the
  Drive service-account key relative to the repo''s location, which a nested .run-plan-worktrees
  checkout breaks. sandbox: false because weekly-check-on-metis deploys to the Metis
  server over ssh (deploy@204.168.141.21). Headless stages have no Linear MCP: each
  brief is self-contained and writes its passes to plans/invoice-numbering-drive-passes/<stage-id>.json.
  Launch from claude-setup/cc-sgept-backoffice: /run-plan plans/invoice-numbering-drive.yaml'
stages:
- id: next-number-from-drive
  title: '[Invoicing]: Take the next invoice number from Drive and local folders'
  status: done
  dispatch:
    type: claude
  depends_on: []
  inputs:
    brief: "STAGE next-number-from-drive: Make the next invoice number the highest\
      \ number on Drive or locally, plus one, and report one-sided numbers.\n\nYou\
      \ work in the git repo claude-setup/cc-sgept-backoffice (its own repo, remote\n\
      johannesfritz/cc-sgept-backoffice, branch main). Run every command from that\
      \ repo root.\nBackground: on 2026-10-01 the CEO found two 2026 invoice numbers\
      \ issued twice (26015 to the\nAustralian Permanent Mission and to Rocky Mountain\
      \ Institute; 26012 to ANU and printed on the\nHinrich invoice), eight sent invoices\
      \ missing from the Drive invoicing folder and three Drive\ninvoices missing\
      \ locally. Root causes and the approved fix are in\n../../jf-ceo/sgept-backoffice/invoicing/261001-drive-reconciliation.md;\
      \ the ruled requirements are\nin plans/invoice-numbering-drive-requirements.md.\
      \ Read both before starting.\n\nPlaces:\n- Local invoicing folder: the generator's\
      \ module global OUTPUT_DIR\n  (jf-private/jf-ceo/sgept-backoffice/invoicing).\
      \ Folder names end in \" NNNNN\", e.g.\n  \"260911 GTA Interos Inc. 26033\"\
      .\n- Drive invoicing folder: id 19bPRghIb2L3cdxZzIattO65uM5En6dHM (\"5 invoicing\
      \ (Debitoren)\"),\n  reached through the Drive API with the service account\
      \ that scripts/gdrive_upload.py already\n  uses (impersonating johannes.fritz@sgept.org).\
      \ Folder names also end in \" NNNNN\".\n- Invoice numbers are five digits: two-digit\
      \ year plus a three-digit sequence (26036).\n\nContract the acceptance tests\
      \ rely on (tests/conftest.py, tests/test_invoice_numbering.py,\ntests/test_drive_sync.py\
      \ were written at planning time; they are the specification):\n- scripts/generate-invoice.py\
      \ reaches Drive only through the module gdrive_upload, imported at\n  call time\
      \ (not bound at module import), so a test can replace sys.modules[\"gdrive_upload\"\
      ].\n- It reads the local folder through the module global OUTPUT_DIR at call\
      \ time.\n- gdrive_upload.list_invoice_folders() -> list[str] returns the names\
      \ of all non-trashed folders\n  directly under the Drive invoicing folder (all\
      \ pages).\n\nRules for this stage:\n- Do not edit or weaken tests/conftest.py,\
      \ tests/test_invoice_numbering.py or\n  tests/test_drive_sync.py. You may add\
      \ new test files under tests/.\n- Follow the code-quality contract (the cc-sgept-os\
      \ rule code-quality.md and\n  to-backlog/references/code-quality.md): typed,\
      \ documented public functions, no dead code,\n  explicit errors. End with the\
      \ structured self-report.\n- Add one entry to CHANGE-LOG.md at the repo root\
      \ (create it if absent) in the same commit as the\n  change, then commit and\
      \ push to origin main.\n- Stamp every commit with the trailer \"Agent: run-plan/invoice-numbering-drive/<stage-id>\"\
      .\n- Write caps for this run: at most 3 commits; no Linear writes; no emails\
      \ sent.\n- Deny boundary: never write to, rename in or delete from the real\
      \ Drive invoicing folder or the\n  local invoicing folder (tests use fakes and\
      \ temporary folders; real runs only read); never\n  renumber or edit an existing\
      \ invoice; never touch 2025 numbers.\n- Passes: write the passes below to plans/invoice-numbering-drive-passes/<stage-id>.json\
      \ in the canonical shape\n  (id, category, description, steps, passes). Exercise\
      \ each one, flip it to true and save the\n  file immediately after each flip,\
      \ not in one batch. All passes true is required before DONE.\n\nWHAT TO BUILD\n\
      1. gdrive_upload.list_invoice_folders() as specified in the contract above.\n\
      2. In generate-invoice.py:\n   - next_invoice_number(year: int | None = None)\
      \ -> str: two-digit year (default: current\n     year); returns the highest\
      \ NNNNN for that year across local and Drive folder names, plus\n     one; \"\
      YY001\" when the year has none.\n   - invoice_number_report(year: int | None\
      \ = None) -> dict with keys \"drive_only\" and\n     \"local_only\" (sorted\
      \ lists of number strings present on one side only) and \"duplicates\"\n   \
      \  (dict: number -> list of folder names, for numbers used by more than one\
      \ folder on the\n     same side).\n   - CLI flag --next-number [--year YY]:\
      \ print the next number as the only stdout line; print\n     the report's findings\
      \ to stderr; exit 0.\n3. Adoption: rules/invoice-governance.md (Numbering),\
      \ commands/invoice.md,\n   commands/invoice-nipo.md and prompts/invoice-handler.md\
      \ (STEP B, the Metis path) take the\n   number from --next-number instead of\
      \ listing the local folder. Delete the old rule sentence\n   \"The next number\
      \ is the maximum of trailing numbers in ... folder names, plus 1.\"\nToday the\
      \ real result must be 26036 or higher, and the stderr report must show 26015\
      \ as a\nduplicate (two local folders, two Drive folders).\n\nPASSES (write to\
      \ plans/invoice-numbering-drive-passes/next-number-from-drive.json, flip eagerly):\n\
      [\n  {\n    \"id\": 1,\n    \"category\": \"functional\",\n    \"description\"\
      : \"--next-number prints the next free number from Drive and local\",\n    \"\
      steps\": [\n      \"Run python3 scripts/generate-invoice.py --next-number\"\
      ,\n      \"Confirm stdout is a single five-digit number\",\n      \"Confirm\
      \ it equals one more than the highest 26xxx across the Drive folder list and\
      \ the local invoicing folder\"\n    ],\n    \"passes\": false\n  },\n  {\n \
      \   \"id\": 2,\n    \"category\": \"functional\",\n    \"description\": \"one-sided\
      \ and duplicate numbers are reported on stderr\",\n    \"steps\": [\n      \"\
      Run the same command and read stderr\",\n      \"Confirm 26015 is reported as\
      \ used by two folders\",\n      \"Run the report acceptance test and confirm\
      \ it passes\"\n    ],\n    \"passes\": false\n  },\n  {\n    \"id\": 3,\n  \
      \  \"category\": \"integration\",\n    \"description\": \"the commands, the\
      \ governance rule and the Metis handler use --next-number\",\n    \"steps\"\
      : [\n      \"Read the numbering step of commands/invoice.md, commands/invoice-nipo.md,\
      \ rules/invoice-governance.md and prompts/invoice-handler.md\",\n      \"Confirm\
      \ each calls --next-number and none lists the local folder to pick a number\"\
      \n    ],\n    \"passes\": false\n  }\n]\nDONE WHEN: --next-number returns the\
      \ highest number on Drive or locally plus one, and every numbering instruction\
      \ uses it.\n\n=== SCOPE FENCE: WHAT THIS SLICE DOES NOT OWN ===\nEarlier stages:\
      \ none.\nLater stages own: refusing used numbers (refuse-used-numbers), the\
      \ macOS API sync (mac-sync-via-drive-api), --register (register-outside-invoice),\
      \ --ledger (invoice-register-export), the Metis cron and server deployment (weekly-check-on-metis).\n\
      This slice owns: list_invoice_folders, next_invoice_number, invoice_number_report,\
      \ --next-number, and the four adoption edits.\nOut of scope per the plan: R6\
      \ printed-number check; renumbering or reissuing sent invoices; 2025 numbers;\
      \ committing Metis drafts to jf-private; templates, amounts, bank details, the\
      \ 9-point read-back.\nSettled decisions (do not reopen): Drive and local are\
      \ both authoritative inputs; the printed-number check (R6) is cut; existing\
      \ invoices keep their numbers; the plan runs without a worktree and without\
      \ the sandbox (the Metis stage needs ssh).\n"
  acceptance:
  - description: acceptance test test_next_number_takes_max_of_drive_and_local passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_next_number_takes_max_of_drive_and_local
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no next_invoice_number()
      (2026-10-01)'
  - description: acceptance test test_next_number_starts_new_year_at_001 passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_next_number_starts_new_year_at_001
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no next_invoice_number()
      (2026-10-01)'
  - description: acceptance test test_report_lists_one_sided_and_duplicate_numbers
      passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_report_lists_one_sided_and_duplicate_numbers
    baseline_expect: fail
    baseline_observed: 'exit 1: AssertionError generate-invoice.py has no invoice_number_report()
      (2026-10-01)'
  - description: the real next number, from Drive and local, is at least 26036
    verify: n=$(python3 scripts/generate-invoice.py --next-number 2>/dev/null) &&
      [ "$n" -ge 26036 ]
    baseline_expect: fail
    baseline_observed: 'exit 2: argparse rejects --next-number (2026-10-01)'
  - description: the real report names 26015 as a duplicate
    verify: python3 scripts/generate-invoice.py --next-number 2>&1 >/dev/null | grep
      -q 26015
    baseline_expect: fail
    baseline_observed: 'exit 1: argparse error text, no 26015 (2026-10-01)'
  - description: commands, rule and Metis handler take the number from --next-number
    verify: grep -q -- --next-number rules/invoice-governance.md && grep -q -- --next-number
      commands/invoice.md && grep -q -- --next-number commands/invoice-nipo.md &&
      grep -q -- --next-number prompts/invoice-handler.md
    baseline_expect: fail
    baseline_observed: 'exit 1: flag absent from all four files (2026-10-01)'
  - description: the local-folder-only numbering rule is gone
    verify: '! grep -q ''maximum of trailing numbers'' rules/invoice-governance.md'
    baseline_expect: fail
    baseline_observed: 'exit 1: sentence present in the Numbering section (2026-10-01)'
  - description: acceptance test test_regenerating_same_invoice_is_allowed passes
    verify: python3 -m pytest -q -p no:cacheprovider tests/test_invoice_numbering.py::test_regenerating_same_invoice_is_allowed
    baseline_expect: pass
    baseline_observed: 'exit 0: 1 passed (2026-10-01)'
  referee: true
  outputs:
    linear: JCC-6900
  started_at: '2026-10-01T10:02:00Z'
  notes: '[run-plan] tmux window: stage-next-number-from-drive-


    [run-plan] donemark=DONE; verify clauses passed.'
  completed_at: '2026-10-01T10:03:25Z'
