         rules/invoice-governance.md so none describes copying into the Drive for desktop folder.
      Why: on 2026-10-01 the Mac's Drive for desktop folder listed 6 of the 142 invoice folders and had
      not changed since 2026-09-11, so the mount-based folder reuse could create duplicates.

      PASSES (write to plans/invoice-numbering-drive-passes/mac-sync-via-drive-api.json, flip eagerly):
      [
        {
          "id": 1,
          "category": "integration",
