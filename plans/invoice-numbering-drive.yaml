        tests/test_drive_sync.py. You may add new test files under tests/.
      - Follow the code-quality contract (the cc-sgept-os rule code-quality.md and
        to-backlog/references/code-quality.md): typed, documented public functions, no dead code,
        explicit errors. End with the structured self-report.
